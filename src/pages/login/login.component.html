<div class="min-h-screen flex bg-[#0a0a0a] text-white">
  
  <div class="hidden lg:block lg:w-1/2 relative border-r border-gray-800">
    <img src="https://images.unsplash.com/photo-1593079831268-3381b0db4a77?q=80&w=2069" 
         class="absolute inset-0 w-full h-full object-cover opacity-40">
    <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-transparent to-transparent"></div>
    <div class="absolute inset-0 flex items-center justify-center p-12">
      <h1 class="text-7xl font-black italic uppercase text-[#ea580c] leading-none tracking-tighter">
        Entrena con<br>nosotros
      </h1>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto px-8 py-12 md:px-20 lg:px-24 bg-[#0d0d0d]">
    
    <section class="mb-16">
      <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
        <span class="w-8 h-[2px] bg-[#ea580c]"></span> Iniciar sesión
      </h2>
      
      <form (submit)="onLogin()">
  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Correo</mat-label>
    <input matInput type="email" [(ngModel)]="loginData.email" name="loginEmail"> 
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Contraseña</mat-label>
    <input matInput type="password" [(ngModel)]="loginData.password" name="loginPassword">
  </mat-form-field>
  
  <button type="submit" class="auth-button">Iniciar sesión</button>
</form>
    </section>

    <hr class="border-gray-800 my-12">

    <section>
      <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
        <span class="w-8 h-[2px] bg-[#ea580c]"></span> Registrarse
      </h2>
      
      <form (submit)="onRegister()">
  <mat-form-field appearance="outline" class="w-full">
    <input matInput [(ngModel)]="registerData.nombre" name="regNombre">
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-full">
    <input matInput type="email" [(ngModel)]="registerData.email" name="regEmail">
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-full">
    <input matInput type="password" [(ngModel)]="registerData.password" name="regPassword">
  </mat-form-field>

  
  <button type="submit" class="auth-button">Registrarse</button>
</form>
    </section>

  </div>
</div>
