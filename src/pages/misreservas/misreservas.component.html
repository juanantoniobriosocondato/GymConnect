<div class="min-h-screen bg-[#0a0a0a] pt-28 px-6">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-4xl font-black text-white uppercase italic mb-12">
      Mis <span class="text-orange-600">Reservas</span>
    </h1>

    <div *ngIf="reservas.length > 0; else noReservas" class="grid gap-6">
      <div *ngFor="let clase of reservas" 
           class="bg-[#1a1a1a] border border-gray-800 p-6 rounded-2xl flex justify-between items-center">
        <div>
          <h3 class="text-xl font-bold text-white uppercase tracking-tight">{{clase.nombre}}</h3>
          <p class="text-gray-400 text-sm italic">{{clase.disciplina}} - {{clase.fecha | date:'medium'}}</p>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-orange-600 font-bold text-xs uppercase tracking-widest">Confirmada</span>
          <mat-icon class="text-green-500">check_circle</mat-icon>
          <button (click)="cancelar(clase.id)"
                    class="bg-red text-white font-black px-6 py-2.5 rounded-xl text-xs hover:bg-red-600 hover:text-white transition-all uppercase tracking-tighter">
              Cancelar reserva
          </button>
        </div>
      </div>
    </div>

    <ng-template #noReservas>
      <div class="text-center py-20 text-gray-500">
        <p class="uppercase font-black tracking-widest">Aún no tienes clases reservadas</p>
        <button routerLink="/clases" class="mt-4 text-orange-600 underline">Ver horario</button>
      </div>
    </ng-template>
  </div>
</div>
